# =============================================================================
# Vale configuration for an academic CV / personal HugoBlox website
# =============================================================================
#
# Goals:
# - improve the clarity and professionalism of public-facing prose;
# - catch insensitive or inconsiderate wording;
# - respect Hugo shortcodes and Markdown syntax;
# - avoid rewriting imported scholarly metadata as ordinary website copy;
# - complement, rather than duplicate, codespell and markdownlint.
#
# After changing Packages, run:
#   vale sync
#
# To inspect the fully merged configuration, run:
#   vale ls-config

StylesPath = styles

# Show suggestions during local editing and hooks. Vale only returns a failing
# exit code for rules whose severity is "error".
MinAlertLevel = suggestion

# Hugo is a configuration-only package that teaches Vale to ignore Hugo
# shortcodes. proselint provides general editorial checks, while alex focuses
# on inclusive and considerate language.
Packages = Hugo, proselint, alex

# Existing project vocabulary. Store its files at:
#   styles/config/vocabularies/Blog/accept.txt
#   styles/config/vocabularies/Blog/reject.txt
#
# Add names, institutions, software, biomedical terminology, gene symbols,
# abbreviations, and preferred capitalization here rather than disabling rules.
Vocab = Academic

# =============================================================================
# Public-facing prose
# =============================================================================
#
# This covers the Markdown used by HugoBlox as well as the supplementary prose
# formats selected by hk. The Hugo package contributes its shortcode exclusions
# to Markdown files separately.

[*.{md,markdown,rst,txt}]
BasedOnStyles = Vale, proselint, alex

# codespell already performs repository-wide typo detection. Keep Vale focused
# on project terminology, rejected wording, repeated words, and editorial style.
Vale.Spelling = NO
Vale.Terms = warning
Vale.Avoid = warning
Vale.Repetition = warning

# "Very" can be appropriate in personal or reflective prose and is too weak a
# signal to justify recurring hook noise.
proselint.Very = NO

# These alex rules are especially prone to false positives in quoted material,
# discussions of language, and academic or clinical contexts.
alex.ProfanityUnlikely = NO
alex.Condescending = NO

# =============================================================================
# Imported publication records
# =============================================================================
#
# HugoBlox publication pages commonly contain verbatim titles, abstracts,
# journal names, author lists, gene symbols, drug names, and other domain terms.
# Do not apply ordinary website-copy rules to this imported scholarly metadata.
# The hk hook also excludes this path, but this section keeps direct commands
# such as `vale content/` quiet and predictable.

[content/publication/**/*.{md,markdown}]
BasedOnStyles = Vale

Vale.Spelling = NO
Vale.Terms = NO
Vale.Avoid = NO
Vale.Repetition = NO
