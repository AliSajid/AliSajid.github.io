[tools]
"npm:hugoblox" = "0.12.8"
"npm:renovate" = { version = "44.30.3", trust_policy_excludes = [
    "@yarnpkg/libzip@3.2.2",
] }
"pipx:reuse" = "6.2.0"
"pipx:texthooks" = "0.7.1"
cocogitto = "7.0.0"
cspell = "10.0.1"
gitleaks = "8.30.1"
go = "1.21.13"
hk = "1.51.0"
hugo-extended = "v0.159.2"
lychee = "0.24.2"
node = "24.16.0"
pkl = "0.32.0"
pnpm = "11.15.0"
shellcheck = "0.11.0"
taplo = "0.10.0"
vale = "3.15.1"
yamllint = "1.38.0"
zizmor = "1.27.0"


[tasks.dev]
description = "Run the hugo development server"
run = "hugo server --buildDrafts --buildFuture --cleanDestinationDir --printMemoryUsage --renderStaticToDisk --templateMetrics --enableGitInfo --disableFastRender"

[tasks.build]
description = "Build the production website"
run = "hugo --minify --gc --enableGitInfo"
