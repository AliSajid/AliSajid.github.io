# Sample workflow for building and deploying a Hugo site to GitHub Pages

name: Github Pages Deploy
on:
  push:
    branches:
      - main # Set a branch to deploy
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

defaults:
  run:
    shell: bash
env:
  CHANGES_TO_PUBLISH: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            mise-versions.jdx.dev:80
            mise.jdx.dev:443
            nodejs.org:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            pypi.org:443
            registry.npmjs.org:443
            api.os.dev:443
            tuf-repo-cdn.sigstore.dev:443
            dl.google.com:443

      - name: Install mise-en-place
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Update Draft status of posts
        run: ./scripts/update_drafts.sh

      - name: Test Hugo
        run: |
          which mise
          mise install

      - name: Import GPG key
        if: env.CHANGES_TO_PUBLISH == 'true'
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_KEY_PASSPHRASE }}
          fingerprint: ${{ secrets.GPG_SUBKEY_FINGERPRINT }}
          trust_level: 5
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: false
          git_committer_name: ${{ vars.GIT_AUTHOR_NAME }}
          git_committer_email: ${{ vars.GIT_AUTHOR_EMAIL }}

      - name: Configure Git
        if: env.CHANGES_TO_PUBLISH == 'true'
        run: |
          git config --global user.name "${VARS_GIT_AUTHOR_NAME}"
          git config --global user.email "${VARS_GIT_AUTHOR_EMAIL}"
        env:
          VARS_GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          VARS_GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}

      - name: Commit changes
        if: env.CHANGES_TO_PUBLISH == 'true'
        run: |
          git add .
          git commit -m "Auto-publishing posts [skip ci]"

      - name: Push changes
        if: env.CHANGES_TO_PUBLISH == 'true'
        run: |
          git push

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with Hugo
        run: |
          hugo \
            --minify \
            --baseURL ${STEPS_PAGES_OUTPUTS_BASE_URL} \
            --enableGitInfo
        env:
          STEPS_PAGES_OUTPUTS_BASE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  # Deployment job
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
